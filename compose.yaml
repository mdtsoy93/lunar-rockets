services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: rockets
      POSTGRES_PASSWORD: rockets
      POSTGRES_DB: rockets
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockets -d rockets"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://rockets:rockets@postgres:5432/rockets?sslmode=disable", "up"]

  app:
    build: .
    environment:
      HTTP_ADDR: ":8088"
      DATABASE_URL: postgres://rockets:rockets@postgres:5432/rockets?sslmode=disable
    ports:
      - "8088:8088"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s

volumes:
  postgres_data:
